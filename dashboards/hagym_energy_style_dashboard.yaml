views:
  - type: sections
    title: HAGym Analyse
    path: hagym-analyse
    icon: mdi:chart-box
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: custom:hagym-top-list-card
            title: Trainingsvolumen pro Muskelgruppe
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            scope: muscle_groups
            metric: strength_volume_kg
            limit: 10
          - type: custom:hagym-top-list-card
            title: Trainingsvolumen pro Übung
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            scope: exercises
            metric: strength_volume_kg
            limit: 10
          - type: custom:hagym-top-list-card
            title: Trainingsvolumen pro Equipment
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            scope: equipment
            metric: strength_volume_kg
            limit: 10
      - type: grid
        cards:
          - type: custom:hagym-balance-card
            title: Balance Push/Pull
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            mode: push_pull
          - type: custom:hagym-balance-card
            title: Balance Push/Pull/Legs
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            mode: push_pull_legs
      - type: grid
        cards:
          - type: custom:hagym-top-list-card
            title: Activity Load nach Übung
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            scope: exercises
            metric: activity_load_score
            limit: 8
          - type: custom:hagym-top-list-card
            title: Dauer nach Übung
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            scope: exercises
            metric: duration_minutes
            unit: min
            limit: 8
          - type: custom:hagym-top-list-card
            title: Distanz nach Übung
            daily_metric_entity: sensor.hagym_hagym_personliche_tagesstatistik
            collection_key: hagym
            scope: exercises
            metric: distance_km
            unit: km
            limit: 8
    badges: []
    cards: []
    footer:
      card:
        type: custom:hagym-date-selection
        collection_key: hagym
        placement: inline
        compact: true
        opening_direction: right
        vertical_opening_direction: up
  - type: sections
    max_columns: 4
    title: Cardio
    path: cardio
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:button-card
                entity: button.hafitness_training_starten
                name: |
                  [[[
                    return states['button.hafitness_training_starten']?.attributes?.display_label || 'Training starten';
                  ]]]
                label: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'start_confirm') return 'Zum Starten erneut drücken';
                    if (status === 'active') return 'Training läuft';
                    return 'Bereit';
                  ]]]
                icon: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'start_confirm') return 'mdi:alert-circle-check-outline';
                    if (status === 'active') return 'mdi:play-circle';
                    return 'mdi:play';
                  ]]]
                show_label: true
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.hafitness_training_starten
                styles:
                  card:
                    - border-radius: 22px
                    - padding: 22px
                    - min-height: 96px
                    - background: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'start_confirm') return 'rgba(255, 193, 7, 0.28)';
                          if (status === 'active') return 'rgba(76, 175, 80, 0.24)';
                          return 'rgba(76, 175, 80, 0.14)';
                        ]]]
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 72px 1fr
                    - grid-template-rows: 1fr 1fr
                  icon:
                    - width: 54px
                    - color: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'start_confirm') return '#ff9800';
                          if (status === 'active') return '#4caf50';
                          return '#43a047';
                        ]]]
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 22px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 15px
                    - opacity: 0.85
              - type: custom:mushroom-select-card
                entity: select.hafitness_aktives_equipment
                name: Aktives Equipment
                icon: mdi:bike
                layout: horizontal
              - type: custom:mushroom-select-card
                name: Aktive Aktivität
                icon: mdi:run
                layout: horizontal
                entity: select.hafitness_aktive_ubung
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-number-card
                    entity: number.hagym_dauer
                    name: Dauer
                    icon: mdi:timer-outline
                    display_mode: buttons
                    layout: vertical
                  - type: custom:mushroom-number-card
                    entity: number.hagym_distanz
                    name: Distanz
                    icon: mdi:map-marker-distance
                    display_mode: buttons
                    layout: vertical
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-number-card
                    entity: number.hagym_kalorien
                    name: Kalorien
                    icon: mdi:fire
                    display_mode: buttons
                    layout: vertical
                  - type: custom:mushroom-number-card
                    entity: number.hagym_schritte
                    name: Schritte
                    icon: mdi:shoe-print
                    display_mode: buttons
                    layout: vertical
              - type: horizontal-stack
                cards:
                  - type: custom:mushroom-number-card
                    entity: number.hagym_durchschnittspuls
                    name: Ø Puls
                    icon: mdi:heart-pulse
                    display_mode: buttons
                    layout: vertical
                  - type: custom:mushroom-number-card
                    entity: number.hagym_maximalpuls
                    name: Max Puls
                    icon: mdi:heart
                    display_mode: buttons
                    layout: vertical
              - type: custom:mushroom-select-card
                entity: select.hagym_intensitat
                name: Intensität
                icon: mdi:speedometer
                layout: horizontal
              - type: custom:mushroom-number-card
                entity: number.hagym_zusatzgewicht
                name: Zusatzgewicht
                icon: mdi:weight-kilogram
                display_mode: buttons
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: text.hafitness_notizen
                name: Notizen
                icon: mdi:note-text-outline
                layout: horizontal
              - type: custom:button-card
                entity: button.hagym_aktivitat_speichern
                name: Aktivität speichern
                show_state: true
                icon: mdi:heart-plus
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.hagym_aktivitat_speichern
                styles:
                  card:
                    - border-radius: 28px
                    - padding: 28px
                    - background-color: rgba(33, 150, 243, 0.20)
                  icon:
                    - color: '#2196f3'
                    - width: 72px
                  name:
                    - font-size: 22px
                    - font-weight: bold
                  state:
                    - font-size: 18px
              - type: custom:button-card
                entity: button.hafitness_training_beenden
                name: |
                  [[[
                    return states['button.hafitness_training_beenden']?.attributes?.display_label || 'Training beenden';
                  ]]]
                label: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'finish_confirm') return 'Zum Beenden erneut drücken';
                    if (status === 'active') return 'Training aktiv';
                    return 'Kein aktives Training';
                  ]]]
                icon: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'finish_confirm') return 'mdi:alert-circle-check-outline';
                    return 'mdi:stop';
                  ]]]
                show_label: true
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.hafitness_training_beenden
                styles:
                  card:
                    - border-radius: 22px
                    - padding: 22px
                    - min-height: 96px
                    - background: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'finish_confirm') return 'rgba(255, 152, 0, 0.30)';
                          if (status === 'active') return 'rgba(244, 67, 54, 0.22)';
                          return 'rgba(158, 158, 158, 0.14)';
                        ]]]
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 72px 1fr
                    - grid-template-rows: 1fr 1fr
                  icon:
                    - width: 54px
                    - color: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'finish_confirm') return '#ff9800';
                          if (status === 'active') return '#f44336';
                          return '#9e9e9e';
                        ]]]
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 22px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 15px
                    - opacity: 0.85
    icon: mdi:run
    cards: []
  - type: sections
    max_columns: 4
    title: Training
    path: training
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: custom:button-card
                entity: button.hafitness_training_starten
                name: |
                  [[[
                    return states['button.hafitness_training_starten']?.attributes?.display_label || 'Training starten';
                  ]]]
                label: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'start_confirm') return 'Zum Starten erneut drücken';
                    if (status === 'active') return 'Training läuft';
                    return 'Bereit';
                  ]]]
                icon: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'start_confirm') return 'mdi:alert-circle-check-outline';
                    if (status === 'active') return 'mdi:play-circle';
                    return 'mdi:play';
                  ]]]
                show_label: true
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.hafitness_training_starten
                styles:
                  card:
                    - border-radius: 22px
                    - padding: 22px
                    - min-height: 96px
                    - background: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'start_confirm') return 'rgba(255, 193, 7, 0.28)';
                          if (status === 'active') return 'rgba(76, 175, 80, 0.24)';
                          return 'rgba(76, 175, 80, 0.14)';
                        ]]]
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 72px 1fr
                    - grid-template-rows: 1fr 1fr
                  icon:
                    - width: 54px
                    - color: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'start_confirm') return '#ff9800';
                          if (status === 'active') return '#4caf50';
                          return '#43a047';
                        ]]]
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 22px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 15px
                    - opacity: 0.85
              - type: custom:mushroom-select-card
                entity: select.hafitness_aktives_equipment
                name: Aktives Equipment
                icon: mdi:weight-lifter
                layout: horizontal
              - type: custom:mushroom-select-card
                entity: select.hafitness_aktive_ubung
                name: Aktive Übung
                icon: mdi:format-list-bulleted
                layout: horizontal
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:mushroom-number-card
                    entity: number.hafitness_gewicht
                    name: Gewicht
                    icon: mdi:weight-kilogram
                    display_mode: buttons
                    layout: vertical
                  - type: custom:mushroom-number-card
                    entity: number.hafitness_wiederholungen
                    name: Wiederholungen
                    icon: mdi:repeat
                    display_mode: buttons
                    layout: vertical
              - type: custom:button-card
                entity: sensor.hafitness_aktive_ubung
                name: |
                  [[[
                    const active = states['select.hafitness_aktive_ubung']?.state;
                    const activeEx = states['sensor.hafitness_aktive_ubung'];
                    if (!active || active === 'none' || !activeEx) return 'Beidarmig';
                    const exercise = activeEx?.state?.toLowerCase() || '';
                    const doppel = activeEx?.attributes?.doppel_zaehlen === true;
                    return doppel ? 'Beidarmig: AN' : 'Beidarmig: AUS';
                  ]]]
                icon: mdi:weight-kilogram-variant
                show_state: true
                state: |
                  [[[
                    const active = states['select.hafitness_aktive_ubung']?.state;
                    if (!active || active === 'none') return '';
                    return states['sensor.hafitness_aktive_ubung']?.attributes?.doppel_zaehlen === true ? 'Gewicht zählt doppelt' : 'Gewicht zählt einfach';
                  ]]]
                tap_action:
                  action: none
                styles:
                  card:
                    - background: |
                        [[[
                          const active = states['select.hafitness_aktive_ubung']?.state;
                          const doppel = states['sensor.hafitness_aktive_ubung']?.attributes?.doppel_zaehlen === true;
                          if (active && active !== 'none' && doppel) return 'rgba(255, 193, 7, 0.18)';
                          return 'rgba(158, 158, 158, 0.08)';
                        ]]]
                    - border-radius: 12px
                    - padding: 10px 16px
                  name:
                    - font-size: 14px
                    - font-weight: 600
                    - color: |
                        [[[
                          const doppel = states['sensor.hafitness_aktive_ubung']?.attributes?.doppel_zaehlen === true;
                          const active = states['select.hafitness_aktive_ubung']?.state;
                          if (active && active !== 'none' && doppel) return '#ff9800';
                          return '#757575';
                        ]]]
                  state:
                    - font-size: 13px
                    - color: |
                        [[[
                          const doppel = states['sensor.hafitness_aktive_ubung']?.attributes?.doppel_zaehlen === true;
                          if (doppel) return '#ff9800';
                          return '#9e9e9e';
                        ]]]
              - type: custom:mushroom-entity-card
                entity: text.hafitness_notizen
                name: Notizen
                icon: mdi:note-text-outline
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.hafitness_letzter_satz
                name: Letzter Satz
                icon: mdi:history
                layout: horizontal
              - type: custom:button-card
                entity: button.hafitness_satz_speichern
                name: Satz speichern
                label: |
                  [[[
                    const weight = Number(states['number.hafitness_gewicht']?.state || 0);
                    const reps = Number(states['number.hafitness_wiederholungen']?.state || 0);
                    const doppel = states['sensor.hafitness_aktive_ubung']?.attributes?.doppel_zaehlen === true;
                    const multiplier = doppel ? 2 : 1;
                    const volume = weight * reps * multiplier;
                    const suffix = doppel ? ' (×2)' : '';
                    return `${weight.toLocaleString('de-DE')} kg × ${reps} = ${volume.toLocaleString('de-DE')} kg${suffix}`;
                  ]]]
                icon: mdi:content-save
                show_label: true
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.hafitness_satz_speichern
                styles:
                  card:
                    - border-radius: 22px
                    - padding: 22px
                    - min-height: 96px
                    - background: |
                        [[[
                          const weight = Number(states['number.hafitness_gewicht']?.state || 0);
                          const reps = Number(states['number.hafitness_wiederholungen']?.state || 0);
                          if (weight > 0 && reps > 0) return 'rgba(33, 150, 243, 0.26)';
                          return 'rgba(158, 158, 158, 0.16)';
                        ]]]
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 72px 1fr
                    - grid-template-rows: 1fr 1fr
                  icon:
                    - width: 54px
                    - color: |
                        [[[
                          const weight = Number(states['number.hafitness_gewicht']?.state || 0);
                          const reps = Number(states['number.hafitness_wiederholungen']?.state || 0);
                          if (weight > 0 && reps > 0) return '#2196f3';
                          return '#9e9e9e';
                        ]]]
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 22px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 15px
                    - opacity: 0.85
              - type: custom:button-card
                entity: button.hafitness_training_beenden
                name: |
                  [[[
                    return states['button.hafitness_training_beenden']?.attributes?.display_label || 'Training beenden';
                  ]]]
                label: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'finish_confirm') return 'Zum Beenden erneut drücken';
                    if (status === 'active') return 'Training aktiv';
                    return 'Kein aktives Training';
                  ]]]
                icon: |
                  [[[
                    const status = states['sensor.hafitness_status']?.state;
                    if (status === 'finish_confirm') return 'mdi:alert-circle-check-outline';
                    return 'mdi:stop';
                  ]]]
                show_label: true
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.hafitness_training_beenden
                styles:
                  card:
                    - border-radius: 22px
                    - padding: 22px
                    - min-height: 96px
                    - background: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'finish_confirm') return 'rgba(255, 152, 0, 0.30)';
                          if (status === 'active') return 'rgba(244, 67, 54, 0.22)';
                          return 'rgba(158, 158, 158, 0.14)';
                        ]]]
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 72px 1fr
                    - grid-template-rows: 1fr 1fr
                  icon:
                    - width: 54px
                    - color: |
                        [[[
                          const status = states['sensor.hafitness_status']?.state;
                          if (status === 'finish_confirm') return '#ff9800';
                          if (status === 'active') return '#f44336';
                          return '#9e9e9e';
                        ]]]
                  name:
                    - justify-self: start
                    - align-self: end
                    - font-size: 22px
                    - font-weight: 700
                  label:
                    - justify-self: start
                    - align-self: start
                    - font-size: 15px
                    - opacity: 0.85
    icon: mdi:arm-flex
    cards: []
